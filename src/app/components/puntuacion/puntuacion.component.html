<div appScrollDetection>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de puntuacion</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="src/assets/icon-192x192.png">
</head>
<div class="cuerpo">
  <div class="roundheader">
    <div class="blank">{{ 'ROUND' | translate }} {{ currentRound }}</div>
  </div>
  <div class="container2">
    <div class="container">
      <div class="score-table puntuacion-table">
        <div class="row header">
          <div class="cell"></div>
          <div *ngFor="let player of players" class="cell player-name">{{ player.playerName }}</div>
        </div>
        <div class="row" *ngFor="let figura of figuras">
          <div class="cell figura-label">{{ figura.label }}</div>
          <div *ngFor="let player of players" class="cell">
            <div class="buttons">
              <button class="btn-minus" (click)="decrement(player, figura.field, currentRound)">-</button>
              <span class="inputs badge-valor">{{ getFiguraValue(player, figura.field, currentRound) }}</span>
              <button class="btn-plus" (click)="increment(player, figura.field, currentRound)">+</button>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="fromReview" class="buttons">
        <button (click)="finishReview()">Terminar Revisión</button>
      </div>

      <div *ngIf="!fromReview" class="buttons">
        <button *ngIf="currentRound > 1" (click)="previousRound()">{{ 'PREVIOUS_ROUND' | translate }}</button>
        <button *ngIf="currentRound < 3" (click)="showRoundSummary()">{{ 'NEXT_ROUND' | translate }}</button>
        <button *ngIf="currentRound === 3" (click)="finishGame()">{{ 'FINISH_GAME' | translate }}</button>
      </div>

      <div class="warning">
        <div class="warning-icon">
          <img src="assets/icono_warning.png" alt="Warning Icon">
        </div>
        <div class="warning-text">
          <p>{{ 'WARNING_MESSAGE' | translate }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
</html>
</div>
