<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking de jugadores!</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="src/assets/icon-192x192.png">

</head>
<div class = "landing-container">
<div class="container" *ngIf="players.length<2">

  <p>{{ 'NO_PLAYERS_MESSAGE' | translate }}</p>
  <div class=" buttons">
  <button (click)="home()">{{ 'RETURN_HOME_BUTTON' | translate }}</button>
  </div>
</div>
  
<div class="container" *ngIf="players.length>=2">
<h1>{{ 'PLAYER_RANKING_TITLE' | translate }}</h1>
<table>
  <thead>
    <tr>
      <th>{{ 'POSITION' | translate }}</th>
      <th>{{ 'NAME' | translate }}</th>
      <th>{{ 'POINTS' | translate }}</th>
    </tr>
  </thead>
  <tbody>
    <!-- Iterar sobre los jugadores y mostrar su posición, nombre y puntos -->
    <tr *ngFor="let player of players; let i = index">
      <td>
      <span *ngIf="i === 0">
        <i class="fas fa-crown" style="color: gold;"></i>
      </span>
      <span *ngIf="i === 1">
        <i class="fas fa-crown" style="color: silver;"></i>
      </span>
      <span *ngIf="i === 2">
        <i class="fas fa-crown" style="color: peru;"></i>
      </span>

      <span> </span>
      {{ i + 1 }}</td> <!-- Sumar 1 para obtener la posición basada en 1, no en 0 -->
      <td>{{ player.playerName }}</td>
      <td>{{ player.totalPoints }}</td>
    </tr>
  </tbody>
</table>
</div>
<div  class="buttons-end">
<button  class="new-game" routerLinkActive="active" (click)="review()">{{ 'CHECK_ROUNDS_BUTTON' | translate }}</button> 
<button  class="new-game" routerLinkActive="active" (click)="newGame()">{{ 'NEW_GAME_BUTTON' | translate }}</button> 
</div>
</div>
<footer class="footer">
  <div class="footer-content">
    <p>&copy; {{ 'COPYRIGHT' | translate }}</p>
  </div>
</footer>
</html>
